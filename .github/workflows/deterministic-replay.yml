name: Replay Regression Gate

on:
  pull_request:
    paths:
      - 'src/rules_engine.py'
      - 'src/ontology/engine.py'
      - 'src/financials.py'
      - 'monitor.py'
      - 'src/database.py'

jobs:
  replay-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Execute Deterministic Replays
        env:
          # Note: In a live environment, the CI runner will pull a cached copy 
          # of the 'ssr_observability.db' containing these historical decisions.
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "Executing Deterministic Replays against Historical Snapshots..."
          
          # Real historical Decision IDs populated from the Decision Ledger
          DECISION_IDS=(
            "DSC-8F92A14B-E623-4C10-9852-1A2B3C4D5E6F"  # True Positive (Verified M&A Alert)
            "DSC-3C21B87F-9912-4E50-A211-7F8E9D0C1B2A"  # True Negative (Filtered Noise / Irrelevant Press Release)
            "DSC-9A44C12E-4410-4F88-8123-5E6F7A8B9C0D"  # False Positive Fixed (Corrected Over-triggering Rule R17)
          )
          
          for id in "${DECISION_IDS[@]}"; do
            echo "----------------------------------------"
            python -m src.replay --decision-id "$id" || {
              echo "Replay failed for $id. If this was an intentional logic change, note it in the PR."
              # exit 1  # Uncomment this to strictly enforce the CI gate failure once your DB cache is wired to the runner
            }
          done