name: Test AI Keys

on:
  push:
    paths:
      - '.github/workflows/test_ai_keys.yml'

jobs:
  test_keys:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.11"

      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install openai google-genai

      - name: Run Test Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -c "
import os, openai
or_keys = [k.strip() for k in os.environ.get('OPENROUTER_API_KEY', '').split(',') if k.strip()]
print(f'Found {len(or_keys)} OpenRouter keys.')
success = 0
for i, key in enumerate(or_keys):
    try:
        client = openai.Client(base_url='https://openrouter.ai/api/v1', api_key=key)
        resp = client.chat.completions.create(
            model='google/gemini-2.5-flash',
            messages=[{'role': 'user', 'content': 'Say hi'}],
            max_tokens=5
        )
        print(f'Key {i+1}: Success!')
        success += 1
    except Exception as e:
        print(f'Key {i+1} Failed: {e}')
print(f'Total working OpenRouter keys: {success}/{len(or_keys)}')
          "
