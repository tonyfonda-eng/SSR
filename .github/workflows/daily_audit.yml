name: SSR Daily Forensic Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'

jobs:
  daily-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: |
            ssr_cache.sqlite
            ssr_observability.db
            ssr_devops.db
          key: ssr-database-${{ github.sha }}
          restore-keys: |
            ssr-database-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Auditor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m src.audit.daily_audit

      - name: Send Report via Email
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_RECIPIENT: ${{ secrets.ALERT_EMAIL_RECIPIENT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          REPORT_FILE="docs/daily_audit/$(date -u +%Y-%m-%d).md"
          if [ -f "$REPORT_FILE" ]; then
            python -m src.notifications.send_report_email "$REPORT_FILE"
          else
            echo "Report file not found: $REPORT_FILE"
            exit 1
          fi

      - name: Commit Dashboard
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add docs/daily_audit/*.md || true
          
          git diff --staged --quiet || git commit -m "chore: add daily forensic audit report"
          
          git pull origin main --rebase --autostash -X theirs || git rebase --abort
          git push origin main
