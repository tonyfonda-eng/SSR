name: Build Living Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/*.md'
      - 'src/build_docs.py'
  workflow_dispatch:

concurrency:
  group: "docs-pipeline"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build HTML and SVG
        run: |
          python src/build_docs.py

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Only stage HTML files that correspond to a docs/*.md source this script generates —
          # never touch monitor.yml's dashboard outputs (archive.html, index.html, etc.), which
          # have no .md source and are owned by a different workflow entirely.
          for md in docs/*.md; do
            [ -e "$md" ] || continue
            base=$(basename "$md" .md)
            git add "docs/${base}.html" 2>/dev/null || true
          done
          git add docs/*.svg 2>/dev/null || true

          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-generate html and svg [skip ci]" && git push)
