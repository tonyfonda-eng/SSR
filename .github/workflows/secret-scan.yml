name: Secret scan

on:
  push:
    branches: [ main, infra/secret-scanning ]
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/zricethezav/gitleaks/releases/latest/download/gitleaks_$(uname -s)_$(uname -m).tar.gz \
            | tar xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks (capture exit code)
        id: run_gitleaks
        run: |
          set -o pipefail
          gitleaks detect --source . --report-format sarif --report-path gitleaks-results.sarif --redact || echo $? > gitleaks-exit-code || true
        continue-on-error: true

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: gitleaks-results.sarif

      - name: Fail if gitleaks found leaks
        if: always()
        run: |
          if [[ -f gitleaks-exit-code ]]; then
            code=$(cat gitleaks-exit-code)
            echo "gitleaks exit code: $code"
            if [[ "$code" -ne 0 ]]; then
              exit $code
            fi
          fi
