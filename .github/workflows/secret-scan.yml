name: Secret scan

on:
  push:
    branches: [ main, infra/secret-scanning ]
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ca-certificates curl jq

      - name: Install gitleaks (robust OS/ARCH mapping, fallback to Docker)
        id: install_gitleaks
        run: |
          set -euo pipefail
          OS=$(uname | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) ARCH=amd64 ;;
            aarch64) ARCH=arm64 ;;
            armv7l) ARCH=armv7 ;;
            *) ARCH="$ARCH" ;;
          esac
          URL="https://github.com/zricethezav/gitleaks/releases/latest/download/gitleaks_${OS}_${ARCH}.tar.gz"
          echo "Trying $URL"
          if curl -fSL "$URL" -o /tmp/gitleaks.tar.gz; then
            tar -xzf /tmp/gitleaks.tar.gz -C /tmp
            if [[ -x /tmp/gitleaks ]]; then
              sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
              gitleaks version || true
              echo "installed gitleaks from release asset"
              exit 0
            fi
          fi
          echo "Release asset download failed or binary missing, falling back to Docker wrapper"
          echo "DOCKER_FALLBACK=true" >> $GITHUB_ENV

      - name: Run gitleaks (produce SARIF, capture exit code)
        id: run_gitleaks
        run: |
          set -o pipefail
          REPORT="gitleaks-results.sarif"
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --source . --report-format sarif --report-path "$REPORT" --redact || echo $? > gitleaks-exit-code || true
          elif [[ "${DOCKER_FALLBACK:-}" == "true" ]] && command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$(pwd)":/src -w /src zricethezav/gitleaks:latest detect --source . --report-format sarif --report-path "$REPORT" --redact || echo $? > gitleaks-exit-code || true
          else
            echo "No gitleaks binary and no docker available; aborting." >&2
            echo 2 > gitleaks-exit-code
          fi
        continue-on-error: true

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: gitleaks-results.sarif

      - name: Fail job if gitleaks found leaks
        if: always()
        run: |
          if [[ -f gitleaks-exit-code ]]; then
            code=$(cat gitleaks-exit-code)
            echo "gitleaks exit code: $code"
            if [[ "$code" -ne 0 ]]; then
              echo "gitleaks reported leaks (or encountered an error) - failing job"
              exit $code
            fi
          else
            echo "gitleaks exit code file not found - assuming success"
          fi
